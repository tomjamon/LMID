<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LMID</title>
    <link
      rel="stylesheet"
      href="assets/font/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="assets/css/popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div role="tablist" aria-label="LMID sections" class="tab-list">
        <button
          type="button"
          role="tab"
          class="tab-button"
          id="tab-launch"
          data-tab="launch"
          aria-selected="true"
          aria-controls="launch"
        >
          Applications
        </button>
        <button
          type="button"
          role="tab"
          class="tab-button"
          id="tab-config"
          data-tab="config"
          aria-selected="false"
          aria-controls="config"
        >
          Configuration
        </button>
      </div>
    </header>

    <main>
      <section
        id="launch"
        class="tab-panel is-active"
        role="tabpanel"
        aria-labelledby="tab-launch"
      >
        <div id="launch-grid" class="launch-grid"></div>
      </section>

      <section
        id="config"
        class="tab-panel"
        role="tabpanel"
        aria-labelledby="tab-config"
        hidden
      >
        <div class="config-panel">
          <form id="configuration">
            <ul id="config-list" class="config-list"></ul>
          </form>
        </div>
        <footer class="app-footer">
          Built with <i class="fa fa-heart" aria-hidden="true"></i> by
          <a href="https://tomjamon.com">Tom Jamon</a>
        </footer>
      </section>
    </main>

    <script src="assets/js/defaults.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/launch.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
